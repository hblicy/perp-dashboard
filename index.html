<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perp DEX 数据看板</title><style>
body{background:#09090b;color:#d4d4d8;font:14px system-ui,sans-serif;margin:24px}h1{font-size:20px;color:#fafafa}
table{border-collapse:collapse;width:100%;border:1px solid #27272a}th,td{padding:8px 10px;border-bottom:1px solid #18181b;text-align:right;white-space:nowrap}
th{color:#a1a1aa;cursor:pointer;user-select:none;background:#111113}th:first-child,td:first-child{text-align:left;color:#fafafa}
tr:hover td{background:#141417}.pos{color:#4ade80}.neg{color:#f87171}.muted{color:#71717a;font-size:12px}
</style></head><body><h1>Perp DEX 数据看板</h1>
<div class="muted" id="meta">加载中…</div><br><table><thead><tr id="hd"></tr></thead><tbody id="bd"></tbody></table>
<p class="muted">数据来源：DefiLlama 公共 API（OI、手续费、收入、TVL）；交易量来自 CoinGecko（7D 为每日滚动 24h 量之和，近似）；OI/用户存款为手工快照（见 config.json manual）。— 表示无数据。点表头排序。</p>
<script>
const SNAP=null;
const COLS=[["name","交易所","s"],["oi","持仓量 OI","$"],["oiChange7d","OI 7日变化","%"],["volume24h","24H 交易量","$"],["volume7d","7D 交易量","$"],["fees24h","24H 手续费","$"],["fees7d","7D 手续费","$"],["revenue24h","24H 收入","$"],["tvl","TVL","$"],["oiToDeposits","OI/用户存款","x"]];
let rows=[],sk="oi",sd=-1;
const f$=v=>{if(v==null)return"—";const a=Math.abs(v),n=(x,d)=>x.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});return a>=1e9?"$"+n(v/1e9,2)+"B":a>=1e6?"$"+n(v/1e6,1)+"M":a>=1e3?"$"+n(v/1e3,1)+"k":"$"+n(v,0)};
function cell(c,r){const v=r[c[0]];if(c[2]=="s")return v;if(v==null)return"—";if(c[2]=="%")return`<span class="${v>=0?"pos":"neg"}">${v>=0?"+":""}${(v*100).toFixed(1)}%</span>`;if(c[2]=="x")return v.toFixed(2)+"x"+(r.depositsAt?` <span class=muted>(${r.depositsAt})</span>`:"");return f$(v)}
function draw(){document.getElementById("hd").innerHTML=COLS.map(c=>`<th data-k="${c[0]}">${c[1]}${sk==c[0]?(sd>0?" ▲":" ▼"):""}</th>`).join("");
const s=[...rows].sort((a,b)=>{const x=a[sk],y=b[sk];if(x==null)return 1;if(y==null)return-1;return(typeof x=="string"?x.localeCompare(y):x-y)*sd});
document.getElementById("bd").innerHTML=s.map(r=>"<tr>"+COLS.map(c=>`<td>${cell(c,r)}</td>`).join("")+"</tr>").join("");
document.querySelectorAll("th").forEach(t=>t.onclick=()=>{const k=t.dataset.k;sd=sk==k?-sd:-1;sk=k;draw()})}
function show(d){rows=d.rows;document.getElementById("meta").textContent="更新时间："+new Date(d.fetchedAt).toLocaleString("zh-CN",{timeZone:"Asia/Shanghai"})+"（北京时间）"+(SNAP?"｜静态快照":"｜浏览器直连 DefiLlama/CoinGecko，每 10 分钟自动刷新");draw()}
const CFG={"refresh_seconds": 600, "exchanges": [{"name": "Hyperliquid", "slug": "hyperliquid", "coingecko": "hyperliquid"}, {"name": "Lighter", "slug": "lighter", "coingecko": "lighter"}, {"name": "Lighter (Robinhood Chain)", "slug": "lighter-robinhood-perps", "coingecko": "robinhood-chain-lighter-futures"}, {"name": "Arcus", "slug": "arcus", "coingecko": "arcus-futures"}, {"name": "PopDEX", "slug": "popdex"}, {"name": "StandX", "slug": "standx-perps", "coingecko": "standx"}, {"name": "Nado (Ink)", "slug": "nado", "coingecko": "nado"}, {"name": "BULK", "slug": "bulk", "coingecko": "bulk"}, {"name": "RISEx", "slug": "risex", "coingecko": "risex"}, {"name": "Variational", "slug": "variational", "coingecko": "variational-omni"}, {"name": "Ostium", "slug": "ostium"}, {"name": "N1 (01 Exchange)", "slug": "01-exchange"}, {"name": "QFEX", "slug": "qfex", "coingecko": "qfex"}, {"name": "TxFlow", "slug": "txflow-perps"}, {"name": "Extended", "slug": "extended-perps", "coingecko": "extended"}], "manual": {"_note": "手工数据（OI/用户存款），来自 hyperleaf 页面 2026-10-08 快照；可自行添加/更新", "hyperliquid": {"userDeposits": 6843415120.57, "oiAtSnapshot": 8078468472.95, "snapshotAt": "2026-10-08"}, "lighter": {"userDeposits": 640236222.12, "oiAtSnapshot": 858247648.89, "snapshotAt": "2026-10-08"}, "arcus": {"userDeposits": 45892507.81, "oiAtSnapshot": 76464393.57, "snapshotAt": "2026-10-08"}, "popdex": {"userDeposits": 5332389.41, "oiAtSnapshot": 38981550.86, "snapshotAt": "2026-10-08"}}};
const L="https://api.llama.fi",G="https://api.coingecko.com/api/v3",Q="excludeTotalDataChart=true&excludeTotalDataChartBreakdown=true";
const J=async u=>{try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}};
const N=x=>typeof x=="number"&&isFinite(x)?x:null;
async function one(ex){const s=encodeURIComponent(ex.slug);
 const [oi,fe,rv,tv]=await Promise.all([J(`${L}/summary/open-interest/${s}?excludeTotalDataChartBreakdown=true`),J(`${L}/summary/fees/${s}?${Q}`),J(`${L}/summary/fees/${s}?dataType=dailyRevenue&${Q}`),J(`${L}/tvl/${s}`)]);
 const today=Math.floor(Date.now()/864e5)*86400,pts=((oi||{}).totalDataChart||[]).filter(c=>c[0]<today).sort((a,b)=>a[0]-b[0]);
 let o=null,ch=null;if(pts.length){const l=pts[pts.length-1];o=l[1];const p=pts.find(c=>c[0]==l[0]-604800);ch=p&&p[1]>0?l[1]/p[1]-1:null}
 const m=(CFG.manual||{})[ex.slug]||{},dep=N(m.userDeposits),O=o??N((oi||{}).total24h);
 return {name:ex.name,slug:ex.slug,oi:O,oiChange7d:ch,fees24h:N((fe||{}).total24h),fees7d:N((fe||{}).total7d),revenue24h:N((rv||{}).total24h),tvl:N(tv),userDeposits:dep,depositsAt:m.snapshotAt,oiToDeposits:dep&&O!=null?O/dep:null,volume24h:null,volume7d:null,...(ex.extra||{})}}
async function vols(rows){const lst=await J(`${G}/derivatives/exchanges?per_page=300`)||[],p=await J(`${G}/simple/price?ids=bitcoin&vs_currencies=usd`),btc=N(p&&p.bitcoin&&p.bitcoin.usd);if(!btc)return;
 const by=Object.fromEntries(lst.map(e=>[e.id,e]));
 for(const ex of CFG.exchanges){const e=by[ex.coingecko],r=rows.find(x=>x.slug==ex.slug);if(!e||!r)continue;
  const v=parseFloat(e.trade_volume_24h_btc);r.volume24h=isFinite(v)?v*btc:null;draw();
  const c=await J(`${G}/exchanges/${ex.coingecko}/volume_chart?days=14`);
  if(c&&c.length){const P=c.map(([t,v])=>[t,+v]).sort((a,b)=>a[0]-b[0]),last=P[P.length-1][0],pk=[];
   for(let i=0;i<7;i++){const t=last-i*864e5,b=P.reduce((a,x)=>Math.abs(x[0]-t)<Math.abs(a[0]-t)?x:a);if(Math.abs(b[0]-t)<=72e5)pk.push(b[1])}
   if(pk.length==7)r.volume7d=pk.reduce((a,b)=>a+b,0)*btc;draw()}
  await new Promise(z=>setTimeout(z,2500))}}
async function load(){const rs=await Promise.all(CFG.exchanges.map(one));show({fetchedAt:new Date().toISOString(),rows:rs});await vols(rs);draw()}
load();setInterval(load,600000)
</script></body></html>
